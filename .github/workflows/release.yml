name: Release OptiPlex Studio 0.3.0
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: optiplex-studio-release-0.3.0
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[release 0.3.0]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact public source commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install build and fixture-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 libgtk-3-bin dbus-x11 desktop-file-utils binutils
      - name: Build and test
        run: |
          make -f Makefile.studio package
          /usr/bin/python3 -B tests/run_gtk.py
          /usr/bin/python3 -B studio/validate_package.py
          cd dist
          sha256sum optiplex-studio_0.3.0_amd64.deb > optiplex-studio_0.3.0_amd64.deb.sha256
      - name: Publish validated Debian package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v0.3.0 already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh release create v0.3.0 dist/optiplex-studio_0.3.0_amd64.deb dist/optiplex-studio_0.3.0_amd64.deb.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'OptiPlex Studio 0.3.0' --notes-file RELEASE-0.3.0.md --draft
          gh release edit v0.3.0 --repo "$GITHUB_REPOSITORY" --draft=false --latest
