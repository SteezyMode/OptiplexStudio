name: Publish OptiPlex Studio

# No automatic release or asset overwrite from a development commit.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: optiplex-studio-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install package and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 libgtk-3-bin dbus-x11 desktop-file-utils binutils gvfs-backends gvfs-fuse xvfb xauth x11-utils
      - name: Verify tag, run tests, build and validate artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          test "$version" != "$GITHUB_REF_NAME"
          /usr/bin/python3 -m unittest discover -s tests -p 'test_desktop_process.py' -v
          make -f Makefile.studio package
          package="dist/optiplex-studio_${version}_amd64.deb"
          test -f "$package"
          test "$(dpkg-deb -f "$package" Package)" = "optiplex-studio"
          test "$(dpkg-deb -f "$package" Version)" = "$version"
          test "$(dpkg-deb -f "$package" Architecture)" = "amd64"
          /usr/bin/python3 -B tests/run_gtk.py --package "$package"
          /usr/bin/python3 -B studio/validate_package.py "$package"
          bash tests/smoke_installed_package.sh
          (cd dist && sha256sum "optiplex-studio_${version}_amd64.deb" > "optiplex-studio_${version}_amd64.deb.sha256")
      - name: Publish new release without replacing previous assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; refusing to overwrite published assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/optiplex-studio_${version}_amd64.deb" \
            "dist/optiplex-studio_${version}_amd64.deb.sha256" \
            --target "$GITHUB_SHA" \
            --title "OptiPlex Studio ${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest
