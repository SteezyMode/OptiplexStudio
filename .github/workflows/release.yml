name: Release OptiPlex Studio 0.4.0
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: optiplex-studio-release-0.4.0
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[release 0.4.0]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact public source commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install build and fixture-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 libgtk-3-bin dbus-x11 desktop-file-utils binutils
      - name: Build and test
        run: |
          /usr/bin/python3 -m unittest discover -s tests -p 'test_desktop_process.py' -v
          make -f Makefile.studio package
          /usr/bin/python3 -B tests/run_gtk.py --package dist/optiplex-studio_0.4.0_amd64.deb
          /usr/bin/python3 -B studio/validate_package.py
          cd dist
          sha256sum optiplex-studio_0.4.0_amd64.deb > optiplex-studio_0.4.0_amd64.deb.sha256
      - name: Publish validated Debian package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          test "$(gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          gh release upload v0.4.0 dist/optiplex-studio_0.4.0_amd64.deb dist/optiplex-studio_0.4.0_amd64.deb.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          { cat README-STUDIO.md; printf '\nAsset source commit: %s\n' "$GITHUB_SHA"; } > "$RUNNER_TEMP/studio-release-notes.md"
          gh release edit v0.4.0 --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/studio-release-notes.md"
