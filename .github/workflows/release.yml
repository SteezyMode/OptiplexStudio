name: Release OptiPlex Studio

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: optiplex-studio-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build and fixture-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 libgtk-3-bin dbus-x11 desktop-file-utils binutils gvfs-backends gvfs-fuse

      - name: Build, test, and validate
        run: |
          make -f Makefile.studio package
          /usr/bin/python3 -B tests/run_gtk.py --package "dist/optiplex-studio_${GITHUB_REF_NAME#v}_amd64.deb"
          /usr/bin/python3 -B studio/validate_package.py

      - name: Verify tag matches package metadata and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          case "$version" in
            *[!0-9.]* | .* | *..* | *.) echo "Invalid version tag"; exit 1 ;;
          esac
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          package="dist/optiplex-studio_${version}_amd64.deb"
          test -f "$package"
          test "$(dpkg-deb -f "$package" Version)" = "$version"
          (cd dist && sha256sum "optiplex-studio_${version}_amd64.deb" > "optiplex-studio_${version}_amd64.deb.sha256")

      - name: Publish new release only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace existing assets."
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/optiplex-studio_${version}_amd64.deb" \
            "dist/optiplex-studio_${version}_amd64.deb.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "OptiPlex Studio $version" \
            --generate-notes
