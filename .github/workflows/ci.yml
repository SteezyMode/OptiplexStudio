name: Studio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install test and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 libgtk-3-bin dbus-x11 desktop-file-utils binutils gvfs-backends gvfs-fuse

      - name: Build and run unit tests
        run: make -f Makefile.studio check

      - name: Build and validate Debian package
        run: |
          make -f Makefile.studio package
          /usr/bin/python3 -B tests/run_gtk.py --package dist/optiplex-studio_0.3.0_amd64.deb
          /usr/bin/python3 -B studio/validate_package.py

      - name: Upload test package for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: optiplex-studio-ci-package
          path: dist/optiplex-studio_0.3.0_amd64.deb
          retention-days: 7
