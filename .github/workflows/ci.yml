name: Validate OptiPlex Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 libgtk-3-bin dbus-x11 desktop-file-utils binutils gvfs-backends gvfs-fuse
      - name: Build, run regressions, exercise GUI and validate package
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -p 'test_desktop_process.py' -v
          make -f Makefile.studio package
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name 'optiplex-studio_*_amd64.deb')
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          test "$(dpkg-deb -f "$package" Package)" = "optiplex-studio"
          /usr/bin/python3 -B tests/run_gtk.py --package "$package"
          /usr/bin/python3 -B studio/validate_package.py "$package"
